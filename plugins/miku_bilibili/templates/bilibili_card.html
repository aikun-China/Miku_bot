<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    width: 600px;
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
    background-image: url("{bg_data_uri}");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-color: #1a1a2e;
    position: relative;
    overflow: hidden;
}

body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, rgba(0,0,0,0.30) 0%, rgba(0,0,0,0.55) 100%);
    z-index: 0;
}

.content {
    position: relative;
    z-index: 2;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.glass {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(6px) saturate(150%);
    -webkit-backdrop-filter: blur(6px) saturate(150%);
    border: 1px solid rgba(255, 255, 255, 0.22);
    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.40),
        inset 0 -1px 0 rgba(255, 255, 255, 0.08),
        0 4px 20px rgba(0, 0, 0, 0.25);
}

.glass-light {
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(4px) saturate(140%);
    -webkit-backdrop-filter: blur(4px) saturate(140%);
    border: 1px solid rgba(255, 255, 255, 0.18);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.32);
}

/* 标题栏 */
.header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-radius: 14px;
    margin-bottom: 14px;
}
.header-left { display: flex; align-items: center; gap: 10px; }
.header-title {
    font-size: 18px;
    font-weight: bold;
    color: #ffffff;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    letter-spacing: 2px;
}
.header-tag {
    padding: 5px 12px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.header-tag-icon { width: 18px; height: 18px; display: block; color: #ffffff; }

/* 主卡片 */
.card {
    width: 100%;
    border-radius: 20px;
    overflow: hidden;
}

.cover-wrap {
    position: relative;
    width: 100%;
    height: 380px;
    background: rgba(0, 0, 0, 0.25);
    overflow: hidden;
}
.cover-wrap img { width: 100%; height: 100%; object-fit: cover; }
.cover-placeholder {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: 56px; color: rgba(255, 255, 255, 0.35);
}

.info-section { padding: 18px 20px; }

.video-title {
    font-size: 17px;
    font-weight: bold;
    color: #ffffff;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

/* UP主信息 */
.author-info {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
    padding: 10px 14px;
    border-radius: 12px;
}
.author-avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: linear-gradient(135deg, {theme_color1}, {theme_color2});
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 15px; font-weight: bold;
    flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    overflow: hidden;
}
.author-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.author-name {
    font-size: 14px; color: #ffffff; font-weight: 500; flex: 1;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
}
.author-tag {
    font-size: 11px; color: rgba(255, 255, 255, 0.9);
    padding: 3px 10px; border-radius: 8px;
}

/* 统计数据 */
.stats-row {
    display: flex;
    justify-content: space-between;
    margin-top: 12px;
    gap: 8px;
}
.stat-item {
    flex: 1; text-align: center;
    padding: 10px 4px;
    border-radius: 12px;
}
.stat-value {
    font-size: 16px; font-weight: bold; color: #ffffff;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
}
.stat-label {
    font-size: 11px; color: rgba(255, 255, 255, 0.8);
    margin-top: 3px; letter-spacing: 1px;
}

/* 简介 */
.desc-box {
    margin-top: 12px;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.92);
    line-height: 1.6;
    max-height: 60px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
}

/* 底部 */
.footer {
    margin-top: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 6px;
    width: 100%;
}
.footer-date {
    font-size: 12px; color: rgba(255, 255, 255, 0.75);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    letter-spacing: 1px;
}
.footer-brand {
    font-size: 12px; color: rgba(255, 255, 255, 0.7);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    letter-spacing: 2px;
}
</style>
</head>
<body>
<div class="content">
    <div class="header glass">
        <div class="header-left">
            <div class="header-title">{platform_name} 解析</div>
        </div>
        <div class="header-tag glass-light">{header_tag_html}</div>
    </div>

    <div class="card glass">
        <div class="cover-wrap">
            {cover_html}
        </div>

        <div class="info-section">
            <div class="video-title">{title}</div>

            <div class="author-info glass-light">
                <div class="author-avatar">{author_avatar_html}</div>
                <div class="author-name">{author}</div>
                <div class="author-tag glass-light">{author_tag_text}</div>
            </div>

            <div class="stats-row">
                <div class="stat-item glass-light">
                    <div class="stat-value">{stat1}</div>
                    <div class="stat-label">{stat_label1}</div>
                </div>
                <div class="stat-item glass-light">
                    <div class="stat-value">{stat2}</div>
                    <div class="stat-label">{stat_label2}</div>
                </div>
                <div class="stat-item glass-light">
                    <div class="stat-value">{stat3}</div>
                    <div class="stat-label">{stat_label3}</div>
                </div>
                <div class="stat-item glass-light">
                    <div class="stat-value">{stat4}</div>
                    <div class="stat-label">{stat_label4}</div>
                </div>
            </div>

            {desc_html}
        </div>
    </div>

    <div class="footer">
        <div class="footer-date">MikuBot 解析</div>
        <div class="footer-brand">MikuBot</div>
    </div>
</div>
</body>
</html>
