<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    width: 658px;
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
    background: #f0faff url("{bg_data_uri}") center top / cover no-repeat;
    min-height: 987px;
    position: relative;
}
body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0, 229, 232, 0.15) 0%, rgba(0, 184, 186, 0.35) 60%, rgba(0, 184, 186, 0.55) 100%);
    z-index: 0;
}

.content {
    position: relative;
    z-index: 2;
    padding: 24px 20px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.title-box {
    text-align: center;
    color: #ffffff;
    text-shadow: 0 2px 8px rgba(0, 122, 124, 0.6);
    margin-bottom: 24px;
}
.title-icon {
    width: 80px;
    height: 88px;
    object-fit: contain;
    margin: 0 auto -4px;
    display: block;
    filter: drop-shadow(0 4px 12px rgba(0, 122, 124, 0.5));
}
.title-main {
    font-size: 38px;
    font-weight: bold;
    letter-spacing: 5px;
    margin-top: 2px;
}
.title-sub {
    font-size: 14px;
    margin-top: 4px;
    letter-spacing: 2px;
    opacity: 0.95;
}
.title-count {
    display: inline-block;
    margin-top: 6px;
    padding: 3px 12px;
    background: rgba(255, 255, 255, 0.25);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.5);
    border-radius: 999px;
    font-size: 12px;
    color: #ffffff;
    letter-spacing: 1px;
}

/* 双列网格布局 */
.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    width: 100%;
}

/* 商品卡片 */
.item {
    position: relative;
    background: rgba(255, 255, 255, 0.65);
    backdrop-filter: blur(18px) saturate(150%);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    border-radius: 16px;
    box-shadow: 0 6px 22px rgba(0, 122, 124, 0.25);
    border: 1.5px solid rgba(255, 255, 255, 0.75);
    padding: 12px 14px 10px;
    overflow: hidden;
}

.item::before {
    content: "";
    position: absolute;
    left: 0;
    top: 8px;
    bottom: 8px;
    width: 3px;
    background: linear-gradient(180deg, #00e5e8 0%, #00b8ba 100%);
    border-radius: 0 3px 3px 0;
    box-shadow: 0 0 6px rgba(0, 229, 232, 0.5);
}

.item-row {
    display: flex;
    align-items: center;
    gap: 8px;
}
.item-row-1 {
    font-size: 15px;
    color: #007a7c;
    font-weight: 600;
}
.item-row-2 {
    margin-top: 4px;
    padding-left: 2px;
}

.item-index {
    flex: 0 0 auto;
    min-width: 36px;
    text-align: center;
    padding: 2px 6px;
    background: linear-gradient(135deg, rgba(0, 229, 232, 0.18), rgba(0, 184, 186, 0.18));
    border: 1px solid rgba(0, 184, 186, 0.35);
    color: #007a7c;
    font-size: 12px;
    font-weight: 700;
    border-radius: 6px;
    letter-spacing: 1px;
}
.item-name {
    flex: 1 1 auto;
    color: #007a7c;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 15px;
}
.item-price {
    flex: 0 0 auto;
    padding: 3px 10px;
    background: linear-gradient(135deg, #ffb86c 0%, #ff9a3c 100%);
    color: #ffffff;
    font-size: 12px;
    font-weight: 700;
    border-radius: 999px;
    box-shadow: 0 2px 8px rgba(255, 154, 60, 0.3);
    white-space: nowrap;
}

.item-desc {
    display: block;
    width: 100%;
    color: #4a8d8e;
    font-size: 11.5px;
    line-height: 1.5;
    letter-spacing: 0.5px;
    word-break: break-word;
}

.item-sold {
    position: absolute;
    right: 10px;
    bottom: 6px;
    font-size: 10px;
    color: #7fa8a8;
    letter-spacing: 0.5px;
    opacity: 0.85;
}

/* 空状态 */
.empty {
    grid-column: span 2;
    margin-top: 40px;
    padding: 24px 20px;
    background: rgba(255, 255, 255, 0.65);
    backdrop-filter: blur(18px) saturate(150%);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    border: 1.5px dashed rgba(0, 184, 186, 0.4);
    border-radius: 16px;
    text-align: center;
    color: #4a8d8e;
    font-size: 14px;
    letter-spacing: 2px;
}

/* 页脚 */
.footer {
    margin-top: 20px;
    text-align: center;
    color: rgba(255, 255, 255, 0.85);
    font-size: 11px;
    text-shadow: 0 1px 4px rgba(0, 122, 124, 0.5);
    letter-spacing: 2px;
}
</style>
</head>
<body>
<div class="content">
    <div class="title-box">
        {title_icon}
        <div class="title-main">{title}</div>
        <div class="title-sub">商品 · 价格 · 描述</div>
        <div class="title-count">共 {total} 件商品</div>
    </div>

    <div class="grid">
        {items_html}
    </div>

    <div class="footer">MikuBot · 商店 · 发送「购买 &lt;编号/名称&gt; 数量」下单</div>
</div>
</body>
</html>
