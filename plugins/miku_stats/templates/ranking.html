<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    width: 750px;
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
    background: #f0faff url("{bg_data_uri}") center top / cover no-repeat;
    min-height: 1334px;
    position: relative;
}
body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0, 229, 232, 0.12) 0%, rgba(0, 184, 186, 0.3) 50%, rgba(0, 184, 186, 0.45) 100%);
    z-index: 0;
}

.content {
    position: relative;
    z-index: 2;
    padding: 40px 30px 50px;
}

/* 标题区 */
.header {
    text-align: center;
    color: #ffffff;
    text-shadow: 0 2px 8px rgba(0, 122, 124, 0.6);
    margin-bottom: 30px;
}
.header-icon {
    font-size: 56px;
    margin-bottom: 10px;
}
.header-title {
    font-size: 38px;
    font-weight: bold;
    letter-spacing: 6px;
    margin-bottom: 8px;
}
.header-sub {
    font-size: 16px;
    opacity: 0.9;
    letter-spacing: 2px;
}

/* 排行榜卡片 */
.rank-card {
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(18px) saturate(150%);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    border-radius: 24px;
    box-shadow: 0 12px 40px rgba(0, 122, 124, 0.3);
    border: 1.5px solid rgba(255, 255, 255, 0.75);
    padding: 24px;
    margin-bottom: 20px;
}

/* 排行榜列表 */
.rank-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.rank-item {
    display: flex;
    align-items: center;
    padding: 14px 18px;
    background: linear-gradient(135deg, rgba(230, 255, 255, 0.65) 0%, rgba(255, 247, 240, 0.65) 100%);
    border-radius: 16px;
    transition: all 0.2s;
}
.rank-item:hover {
    transform: translateX(4px);
    box-shadow: 0 4px 12px rgba(0, 122, 124, 0.15);
}

.rank-badge {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
    margin-right: 16px;
    flex-shrink: 0;
}
.rank-1 {
    background: linear-gradient(135deg, #ffd700, #ffb700);
    color: #8b4513;
    box-shadow: 0 4px 12px rgba(255, 215, 0, 0.4);
}
.rank-2 {
    background: linear-gradient(135deg, #c0c0c0, #a8a8a8);
    color: #333;
    box-shadow: 0 4px 12px rgba(192, 192, 192, 0.4);
}
.rank-3 {
    background: linear-gradient(135deg, #cd7f32, #b87333);
    color: #fff;
    box-shadow: 0 4px 12px rgba(205, 127, 50, 0.4);
}
.rank-other {
    background: rgba(0, 168, 204, 0.15);
    color: #007a7c;
    font-size: 18px;
}

.avatar-box {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    overflow: hidden;
    border: 2.5px solid rgba(255, 255, 255, 0.9);
    box-shadow: 0 3px 10px rgba(0, 122, 124, 0.25);
    margin-right: 16px;
    flex-shrink: 0;
}
.avatar-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.avatar-fallback {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #00b8ba, #007a7c);
    color: white;
    font-size: 28px;
    font-weight: bold;
}

.user-info {
    flex: 1;
    min-width: 0;
}
.user-name {
    font-size: 18px;
    font-weight: bold;
    color: #007a7c;
    margin-bottom: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.user-id {
    font-size: 12px;
    color: #00b8ba;
}

.score-box {
    text-align: right;
    flex-shrink: 0;
}
.score-value {
    font-size: 28px;
    font-weight: bold;
    color: #007a7c;
}
.score-label {
    font-size: 11px;
    color: #00b8ba;
    margin-top: 2px;
}

/* 空状态 */
.empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #7fa8a8;
}
.empty-icon {
    font-size: 64px;
    margin-bottom: 16px;
    opacity: 0.6;
}
.empty-text {
    font-size: 16px;
}

/* 底部信息 */
.footer {
    text-align: center;
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px dashed rgba(255, 255, 255, 0.4);
    color: rgba(255, 255, 255, 0.85);
    font-size: 13px;
    text-shadow: 0 1px 4px rgba(0, 122, 124, 0.5);
    letter-spacing: 2px;
}

/* 装饰元素 */
.decor {
    position: absolute;
    top: 120px;
    right: 30px;
    font-size: 48px;
    opacity: 0.15;
    pointer-events: none;
}
</style>
</head>
<body>
<div class="content">
    <div class="decor">{decor_icon}</div>
    
    <div class="header">
        <div class="header-icon">{rank_icon}</div>
        <div class="header-title">{title}</div>
        <div class="header-sub">{subtitle}</div>
    </div>

    <div class="rank-card">
        <div class="rank-list">
            {rank_items}
        </div>
    </div>

    <div class="footer">MikuBot · {footer_text}</div>
</div>
</body>
</html>
