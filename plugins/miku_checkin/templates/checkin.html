<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    width: 720px;
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
    background: #f0faff url("{bg_data_uri}") center top / cover no-repeat;
    min-height: 1100px;
    position: relative;
}
body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0, 229, 232, 0.15) 0%, rgba(0, 184, 186, 0.35) 70%, rgba(0, 184, 186, 0.55) 100%);
    z-index: 0;
}

/* 内容容器 */
.content {
    position: relative;
    z-index: 2;
    padding: 40px 40px 50px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* 标题区 */
.title-box {
    text-align: center;
    color: #ffffff;
    text-shadow: 0 2px 8px rgba(0, 122, 124, 0.6);
    margin-top: 30px;
}
.title-icon {
    width: 120px;
    height: 130px;
    object-fit: contain;
    margin: 0 auto -10px;
    display: block;
    filter: drop-shadow(0 4px 12px rgba(0, 122, 124, 0.5));
}
.title-main {
    font-size: 56px;
    font-weight: bold;
    letter-spacing: 8px;
    margin-top: 4px;
}
.title-sub {
    font-size: 18px;
    margin-top: 8px;
    letter-spacing: 4px;
    opacity: 0.95;
}

/* 主卡片（毛玻璃效果） */
.card {
    background: rgba(255, 255, 255, 0.65);
    backdrop-filter: blur(18px) saturate(150%);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    border-radius: 24px;
    box-shadow: 0 12px 40px rgba(0, 122, 124, 0.35);
    border: 1.5px solid rgba(255, 255, 255, 0.75);
    width: 520px;
    margin-top: 350px;
    padding: 28px 32px 24px;
}

/* 日期行 */
.date-row {
    text-align: center;
    color: #007a7c;
    font-size: 20px;
    font-weight: 500;
    padding-bottom: 16px;
    border-bottom: 2px dashed #d0efff;
}

/* 用户信息 */
.user-info {
    text-align: center;
    padding: 18px 0 6px;
}
.avatar-container {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    margin: 0 auto 12px;
    overflow: hidden;
    border: 3px solid rgba(255, 255, 255, 0.9);
    box-shadow: 0 4px 12px rgba(0, 122, 124, 0.3);
}
.avatar {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.avatar-fallback {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #00b8ba, #007a7c);
    color: white;
    font-size: 42px;
    font-weight: bold;
}
.user-name {
    font-size: 22px;
    font-weight: bold;
    color: #007a7c;
    margin-bottom: 8px;
}
.user-id {
    font-size: 13px;
    color: #00b8ba;
}
.user-uid {
    font-size: 12px;
    color: #00b8ba;
    margin-top: 4px;
    letter-spacing: 1px;
    opacity: 0.8;
}

/* 统计行（三个指标：天数/金币/好感） */
.stats {
    display: flex;
    justify-content: space-around;
    margin: 18px 0 14px;
    padding: 18px 0;
    background: linear-gradient(135deg, rgba(230, 255, 255, 0.45) 0%, rgba(255, 247, 240, 0.45) 100%);
    border-radius: 14px;
}
.stat-item {
    flex: 1;
    text-align: center;
}
.stat-value {
    font-size: 34px;
    font-weight: bold;
    color: #007a7c;
    line-height: 1.1;
}
.stat-label {
    font-size: 13px;
    color: #00b8ba;
    margin-top: 4px;
}

/* 奖励提示（首次签到时显示） */
.reward {
    text-align: center;
    padding: 12px 0;
    font-size: 15px;
    color: #007a7c;
    background: linear-gradient(135deg, rgba(0, 229, 232, 0.15), rgba(0, 184, 186, 0.15));
    border-radius: 10px;
    margin-bottom: 16px;
}
.reward-hint {
    text-align: center;
    padding: 12px 0;
    font-size: 14px;
    color: #7fa8a8;
    background: rgba(245, 250, 251, 0.5);
    border-radius: 10px;
    margin-bottom: 16px;
}

/* 双倍好感（由卡触发） */
.bonus-card {
    text-align: center;
    padding: 10px 0;
    font-size: 14px;
    color: #7a4a00;
    background: linear-gradient(135deg, rgba(255, 246, 214, 0.6), rgba(255, 230, 176, 0.6));
    border-radius: 10px;
    margin-bottom: 10px;
    font-weight: 500;
}

/* 双倍好感（3% 幸运触发） */
.bonus-lucky {
    text-align: center;
    padding: 10px 0;
    font-size: 14px;
    color: #c74b7d;
    background: linear-gradient(135deg, rgba(255, 238, 244, 0.65), rgba(255, 214, 227, 0.65));
    border-radius: 10px;
    margin-bottom: 10px;
    font-weight: 600;
}

/* 卡片 / buff 状态提示（低调小字） */
.sub-info {
    text-align: center;
    font-size: 12px;
    color: #7fa8a8;
    padding: 4px 0 8px;
    letter-spacing: 1px;
}

/* 签到时间 */
.checkin-time {
    text-align: center;
    font-size: 14px;
    color: #00b8ba;
    padding: 8px 0 16px;
}
.checkin-time .label {
    color: #7fa8a8;
    margin-right: 6px;
}
.checkin-time .time {
    color: #007a7c;
    font-weight: 500;
    font-size: 16px;
}

/* 语录区 */
.quote-box {
    margin-top: 26px;
    padding: 20px 24px;
    background: rgba(255, 255, 255, 0.65);
    backdrop-filter: blur(14px) saturate(150%);
    -webkit-backdrop-filter: blur(14px) saturate(150%);
    border-radius: 20px;
    border: 1.5px solid rgba(255, 255, 255, 0.75);
    box-shadow: 0 6px 24px rgba(0, 122, 124, 0.22);
    width: 520px;
    position: relative;
}
.quote-text {
    font-size: 17px;
    color: #007a7c;
    line-height: 1.8;
    text-align: center;
    position: relative;
    padding: 6px 12px;
}
.quote-text::before {
    content: """;
    position: absolute;
    top: -4px;
    left: 4px;
    font-size: 48px;
    color: rgba(0, 229, 232, 0.35);
    font-family: Georgia, serif;
    line-height: 1;
}
.quote-source {
    text-align: right;
    margin-top: 14px;
    color: #00b8ba;
    font-size: 13px;
    padding-right: 8px;
}

/* 底部 */
.footer {
    margin-top: 28px;
    text-align: center;
    color: rgba(255, 255, 255, 0.85);
    font-size: 13px;
    text-shadow: 0 1px 4px rgba(0, 122, 124, 0.5);
    letter-spacing: 2px;
}
</style>
</head>
<body>
<div class="content">
    <div class="title-box">
        {title_icon}
        <div class="title-main">MIKU 签到</div>
        <div class="title-sub">每一次签到，都是与你的约定</div>
    </div>

    <div class="card">
        <div class="date-row">{date_cn}</div>
        <div class="user-info">
            <div class="avatar-container">
                {avatar_html}
            </div>
            <div class="user-name">{nickname}</div>
            <div class="user-id">QQ {user_id}</div>
            <div class="user-uid">UID {uid}</div>
        </div>
        <div class="stats">
            <div class="stat-item">
                <div class="stat-value">{total_days}</div>
                <div class="stat-label">累计签到</div>
            </div>
            <div class="stat-item">
                <div class="stat-value">{coins}</div>
                <div class="stat-label">金币</div>
            </div>
            <div class="stat-item">
                <div class="stat-value">{favor}</div>
                <div class="stat-label">好感度</div>
            </div>
        </div>
        {reward_html}
        <div class="checkin-time">
            <span class="label">今日签到时间</span>
            <span class="time">{today_first_time}</span>
        </div>
    </div>

    <div class="quote-box">
        <div class="quote-text">{quote}</div>
        <div class="quote-source">—— {quote_source}</div>
    </div>

    <div class="footer">MikuBot · 与你同在的每一天</div>
</div>
</body>
</html>
