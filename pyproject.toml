[project]
name = "miku-bot"
version = "1.0.0"
description = "MikuBot - 基于 NoneBot2 的多功能 QQ 机器人"
readme = "README.md"
license = "AGPL-3.0"
license-files = ["LICENSE"]
authors = [
    { name = "aikun-China", email = "aikun@example.com" },
]
requires-python = ">=3.10"
dependencies = [
    "nonebot2>=2.5.0",
    "nonebot-adapter-onebot>=2.4.0",
    "fastapi>=0.137.0",
    "uvicorn>=0.49.0",
    "websockets>=16.0",
    "httpx>=0.28.0",
    "PyYAML>=6.0",
    "APScheduler>=3.10.0",
    "psutil>=7.0.0",
    "playwright>=1.60.0",
    "Pillow>=10.4.0,<11.0.0",
    "imagehash>=4.3.0",
    "yt-dlp>=2024.12.01",
    "curl-cffi>=0.7.0",
    # 第三方娱乐插件（NoneBot2 商店包，uv add / uv sync 安装后由 bot.py 加载）
    "nonebot-plugin-dorodoro>=1.0.0",
    "nonebot-plugin-petpet>=0.3.21",
    "pyncm>=1.7",
]

[tool.nonebot]
plugin_dirs = ["plugins"]
builtin_plugins = ["echo"]

[tool.uv]
override-dependencies = [
    "pillow>=10.4.0,<11",
]

[[tool.uv.index]]
name = "tencent-mirror"
url = "https://mirrors.cloud.tencent.com/pypi/simple/"

[tool.uv.sources]
pyncm = { index = "tencent-mirror" }
