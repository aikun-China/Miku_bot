<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设备管理 - MikuBot 管理后台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/theme.js"></script>
<style>
body{font-family:"Noto Sans SC",sans-serif;background:linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 50%, var(--theme-glow) 100%);color:var(--text-primary);}
.main{min-height:100vh;padding:28px 32px;margin-left:240px;}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
.page-title{font-size:22px;font-weight:700;margin-bottom:8px;color:var(--text-primary);}
.page-hint{color:var(--text-secondary);font-size:13px;margin-bottom:0;}

.device-section{margin-bottom:28px;}
.device-section .section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap;}
.device-section .section-title{margin:0;padding:0;border:none;font-size:16px;font-weight:600;}
.badge-count{background:var(--bg-hover);padding:3px 10px;border-radius:12px;font-size:12px;color:var(--warning);font-weight:500;}
.badge-count.ok{color:var(--success);}
.badge-count.bad{color:var(--danger);}

.device-card{
    background:rgba(255,255,255,0.7);
    backdrop-filter:blur(18px) saturate(180%);
    -webkit-backdrop-filter:blur(18px) saturate(180%);
    border:1px solid var(--border-color);
    border-radius:var(--radius-sm);
    padding:16px;margin-bottom:12px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.6),0 6px 18px rgba(31,58,74,0.08);
}
.device-card.pending{border-color:var(--warning);}
.device-card .row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;flex-wrap:wrap;gap:8px;}
.device-card .row .label{color:var(--text-secondary);flex-shrink:0;}
.device-card .row .value{color:var(--text-primary);font-family:"JetBrains Mono",monospace;word-break:break-all;text-align:right;flex:1;}
.device-card .header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border-color);flex-wrap:wrap;gap:8px;}
.device-card .name{font-size:14px;font-weight:600;color:var(--text-primary);}
.device-card .flag{font-size:11px;padding:3px 8px;border-radius:10px;}
.flag-pending{background:rgba(232,132,47,.18);color:var(--warning);}
.flag-approved{background:rgba(43,168,106,.15);color:var(--success);}
.flag-rejected{background:rgba(214,69,69,.18);color:var(--danger);}
.flag-local{background:var(--theme-glow);color:var(--theme-primary);margin-left:6px;}

.device-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:flex-end;}
.btn{padding:10px 18px;background:linear-gradient(135deg,#2BA89E,#3A6E8E);border:none;border-radius:var(--radius-sm);color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:0.2s;}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px var(--theme-glow);}
.btn-sec{background:rgba(255,255,255,0.7);border:1px solid var(--border-color);color:var(--text-secondary);backdrop-filter:blur(10px) saturate(180%);-webkit-backdrop-filter:blur(10px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,0.6);}
.btn-danger{background:linear-gradient(135deg,#D64545,#B53535);color:#fff;}
.btn-sm{padding:8px 14px;font-size:13px;}

.empty-panel{background:var(--bg-hover);border:1px dashed var(--border-color);border-radius:var(--radius-sm);padding:24px;text-align:center;color:var(--text-secondary);font-size:13px;}
.device-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;}

@media (max-width: 768px) {
    .main{margin-left:0;padding:72px 14px 20px 14px;}
    .page-title{font-size:18px;text-align:center;}
    .page-hint{font-size:12px;text-align:center;margin-bottom:16px;}
    .device-grid{grid-template-columns:1fr;gap:10px;}
    .device-card{padding:12px;}
    .device-card .row{font-size:12px;}
    .device-card .name{font-size:13px;}
    .device-actions{justify-content:stretch;}
    .device-actions .btn{flex:1;padding:8px 10px;font-size:12px;}
}
</style>
</head>
<body>
<div id="sidebar"></div>
<div class="main">
    <div class="page-header">
        <div>
            <h1 class="page-title">设备管理</h1>
            <p class="page-hint">管理所有已授权和待批准的设备访问权限。</p>
        </div>
        <div id="theme-container"></div>
    </div>

    <div class="device-section">
        <div class="section-header">
            <div class="section-title">待批准设备</div>
            <div style="display:flex;gap:8px;align-items:center;">
                <span class="badge-count" id="pending-count">待批准 0</span>
                <button class="btn btn-sec btn-sm" onclick="loadDevices()">刷新</button>
            </div>
        </div>
        <div id="device-pending-area"></div>
    </div>

    <div class="device-section">
        <div class="section-header">
            <div class="section-title">已授权设备</div>
            <span class="badge-count ok" id="approved-count">已批准 0</span>
        </div>
        <div id="device-approved-area"></div>
    </div>

    <div class="device-section">
        <div class="section-header">
            <div class="section-title">已拒绝设备</div>
            <span class="badge-count bad" id="rejected-count">已拒绝 0</span>
        </div>
        <div id="device-rejected-area"></div>
    </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script>
var pendingDevices = [], approvedDevices = [], rejectedDevices = [];

async function loadDevices() {
    try {
        var data = await window.api.device.list();
        pendingDevices = data.pending || [];
        approvedDevices = data.approved || [];
        rejectedDevices = data.rejected || [];
        renderDevices();
    } catch (e) {
        window.Toast.error("加载设备列表失败: " + e.message);
    }
}

function renderDevices() {
    document.getElementById("pending-count").textContent = "待批准 " + pendingDevices.length;
    document.getElementById("approved-count").textContent = "已批准 " + approvedDevices.length;
    document.getElementById("rejected-count").textContent = "已拒绝 " + rejectedDevices.length;

    document.getElementById("device-pending-area").innerHTML = renderDeviceGroup(
        pendingDevices, "pending",
        "等待批准（点击「同意」允许该设备访问管理后台）",
        "暂无等待批准的设备"
    );

    document.getElementById("device-approved-area").innerHTML = renderDeviceGroup(
        approvedDevices, "approved",
        "已授权设备（可访问管理后台）",
        "暂无已批准的设备"
    );

    document.getElementById("device-rejected-area").innerHTML = renderDeviceGroup(
        rejectedDevices, "rejected",
        "已拒绝设备（需删除记录后才能重新申请）",
        "暂无被拒绝的设备"
    );
}

function renderDeviceGroup(list, type, subtitle, emptyMsg) {
    if (!list || list.length === 0) {
        return '<div style="font-size:12px;color:#a0a0c0;margin-bottom:8px;">' + subtitle + '</div>' +
            '<div class="empty-panel">' + emptyMsg + '</div>';
    }

    var header = '<div style="font-size:12px;color:#a0a0c0;margin-bottom:8px;">' + subtitle + '</div>';
    var html = header + '<div class="device-grid">';

    for (var i = 0; i < list.length; i++) {
        var d = list[i];
        var name = d.name || "未命名设备";
        var ip = d.ip || "-";
        var ua = d.ua || "";
        var token = d.token || "";
        var isLocal = !!d.is_local || !!d.isLocal || ip === "127.0.0.1";
        var approvedAt = d.approved_at || "";
        var requestedAt = d.requested_at || "";
        var rejectedAt = d.rejected_at || "";

        var flagClass = "";
        var flagText = "";
        if (type === "pending") { flagClass = "flag-pending"; flagText = "待批准"; }
        if (type === "approved") { flagClass = "flag-approved"; flagText = "已批准"; }
        if (type === "rejected") { flagClass = "flag-rejected"; flagText = "已拒绝"; }

        var cardClass = type === "pending" ? "device-card pending" : "device-card";
        var localBadge = isLocal ? '<span class="flag flag-local">本机</span>' : "";
        var timeRow = "";
        if (approvedAt) timeRow = '<div class="row"><span class="label">批准时间</span><span class="value">' + approvedAt + '</span></div>';
        else if (requestedAt) timeRow = '<div class="row"><span class="label">申请时间</span><span class="value">' + requestedAt + '</span></div>';
        else if (rejectedAt) timeRow = '<div class="row"><span class="label">拒绝时间</span><span class="value">' + rejectedAt + '</span></div>';

        var uaRow = ua ? '<div class="row"><span class="label">浏览器</span><span class="value">' + (ua.length > 60 ? ua.slice(0, 55) + "..." : ua) + '</span></div>' : '';

        var actions = "";
        if (type === "pending") {
            actions = '<div class="device-actions">' +
                '<button class="btn btn-sm btn-sec" onclick="rejectDevice(\'' + token + '\')">拒绝</button>' +
                '<button class="btn btn-sm" onclick="approveDevice(\'' + token + '\')">同意</button>' +
                '</div>';
        } else if (type === "approved") {
            actions = '<div class="device-actions">' +
                '<button class="btn btn-sm btn-sec" onclick="renameDevicePrompt(\'' + token + '\', \'' + name.replace(/'/g, "\\'") + '\')">改名</button>' +
                '<button class="btn btn-sm btn-sec" onclick="rejectDevice(\'' + token + '\')">撤回授权</button>' +
                '<button class="btn btn-sm btn-sec" onclick="removeDevice(\'' + token + '\')">删除记录</button>' +
                '</div>';
        } else {
            actions = '<div class="device-actions">' +
                '<button class="btn btn-sm btn-sec" onclick="removeDevice(\'' + token + '\')">删除记录</button>' +
                '</div>';
        }

        html += '<div class="' + cardClass + '">' +
            '<div class="header">' +
                '<span class="name">' + name + localBadge + '</span>' +
                '<span class="flag ' + flagClass + '">' + flagText + '</span>' +
            '</div>' +
            '<div class="row"><span class="label">IP</span><span class="value">' + ip + '</span></div>' +
            timeRow + uaRow + actions +
        '</div>';
    }

    html += '</div>';
    return html;
}

async function approveDevice(token) {
    try {
        await window.api.device.approve(token);
        window.Toast.success("已批准该设备");
        loadDevices();
    } catch (e) {
        window.Toast.error("批准失败: " + e.message);
    }
}

async function rejectDevice(token) {
    if (!confirm("确认拒绝/撤回此设备的访问权限？")) return;
    try {
        await window.api.device.reject(token);
        window.Toast.success("已拒绝该设备");
        loadDevices();
    } catch (e) {
        window.Toast.error("操作失败: " + e.message);
    }
}

async function removeDevice(token) {
    if (!confirm("确认删除此设备记录？")) return;
    try {
        await window.api.device.remove(token);
        window.Toast.success("已删除记录");
        loadDevices();
    } catch (e) {
        window.Toast.error("删除失败: " + e.message);
    }
}

async function renameDevicePrompt(token, currentName) {
    var newName = prompt("请输入新设备名称：", currentName || "");
    if (!newName || newName.trim() === "" || newName.trim() === currentName) return;
    try {
        await window.api.device.rename(token, newName.trim());
        window.Toast.success("设备已重命名");
        loadDevices();
    } catch (e) {
        window.Toast.error("重命名失败: " + e.message);
    }
}

if (window.ThemeManager) window.ThemeManager.render("#theme-container");
renderSidebar("devices");
requireAuth().then(function(ok){ if (ok) loadDevices(); });
</script>
</body>
</html>
